<!DOCTYPE html>
<html>
<head>
    <title>Creazione Server in Corso</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        /* Mantieni i tuoi stili esistenti */
        #root {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .logo {
            height: 6em;
            padding: 1.5em;
            will-change: filter;
            transition: filter 300ms;
        }
        
        /* Stili specifici per la pagina di loading */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .loading-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .loading-message {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #646cff;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            max-width: 400px;
            height: 10px;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 2rem;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: #646cff;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .loading-container {
                padding: 2rem 1rem;
                width: 90%;
            }
            
            .loading-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <h1 class="loading-title">Creazione server in corso</h1>
            <p class="loading-message">Stiamo configurando il tuo server. Questo processo potrebbe richiedere alcuni minuti.</p>
            
            <div class="loader"></div>
            
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            
            <p id="status-message" class="loading-message">Verifica dello stato del pagamento...</p>
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('status-message');
        let progress = 0;
        let checkCount = 0;
        const maxChecks = 10; // Numero massimo di tentativi

        async function checkStatus() {
            try {
                checkCount++;
                
                // Aggiorna la barra di progresso
                progress = Math.min(progress + (100/maxChecks), 100);
                progressBar.style.width = `${progress}%`;
                
                const response = await axios.post('/api/handle-payment-success', {
                    session_id: "{session_id}"
                });
                
                if (response.data.status === 'completed') {
                    statusMessage.textContent = "Server creato con successo! Reindirizzamento...";
                    progressBar.style.width = "100%";
                    setTimeout(() => {
                        window.location.href = "/dashboard?payment=success";
                    }, 1500);
                    return;
                } else if (response.data.status === 'error') {
                    statusMessage.textContent = "Errore durante la creazione del server";
                    window.location.href = "/dashboard?payment=error";
                    return;
                }
                
                // Messaggi di stato intermedi
                if (checkCount === 3) statusMessage.textContent = "Pagamento verificato, avvio configurazione...";
                if (checkCount === 6) statusMessage.textContent = "Configurazione in corso...";
                
                // Se non abbiamo raggiunto il massimo, continua a controllare
                if (checkCount < maxChecks) {
                    setTimeout(checkStatus, 2000);
                } else {
                    statusMessage.textContent = "Il processo sta impiegando più tempo del previsto...";
                    setTimeout(checkStatus, 3000);
                }
            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Errore di connessione, riprovo...";
                setTimeout(checkStatus, 3000);
            }
        }
        
        // Avvia il processo
        checkStatus();
    </script>
</body>
</html>
